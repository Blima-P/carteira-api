services:
  postgres:
    image: postgres:18.6-alpine
    container_name: carteira-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-carteira}
      POSTGRES_USER: ${DB_USER:-carteira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carteira}
    ports:
      - "5432:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem oficial guarda os dados em /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Só sobe com o perfil "api": docker compose --profile api up -d --build
  # Sem o perfil, sobe apenas o PostgreSQL (para rodar a API com ./mvnw spring-boot:run)
  api:
    profiles: [api]
    image: ${API_IMAGE:-carteira-api:local}
    build: .
    container_name: carteira-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-carteira}
      DB_USER: ${DB_USER:-carteira}
      DB_PASSWORD: ${DB_PASSWORD:-carteira}
      # Sem valor, a API não sobe e explica o motivo no log
      JWT_SECRET: ${JWT_SECRET:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    ports:
      - "8080:8080"

volumes:
  postgres-data:

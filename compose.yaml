services:
  postgres:
    image: postgres:18.6-alpine
    container_name: carteira-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-carteira}
      POSTGRES_USER: ${DB_USER:-carteira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carteira}
    ports:
      - "5432:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem oficial guarda os dados em /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

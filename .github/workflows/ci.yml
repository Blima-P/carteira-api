name: CI

on:
  pull_request:
    branches: [develop, homolog, main]
  push:
    branches: [develop, homolog, main]

# Cancela execuções antigas do mesmo PR/branch quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        run: ./mvnw -B -ntp verify

      - name: Publicar relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # Garante que o Dockerfile continua funcionando: constrói a imagem, sobe com o PostgreSQL e roda o teste de fumaça
  imagem-docker:
    name: imagem-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: carteira-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir API e PostgreSQL
        env:
          API_IMAGE: carteira-api:ci
        run: |
          JWT_SECRET="$(openssl rand -base64 48)"
          export JWT_SECRET
          docker compose --profile api up -d --no-build --wait --wait-timeout 180

      - name: Teste de fumaça
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Logs da API (em caso de falha)
        if: failure()
        run: docker compose --profile api logs --no-color

spring:
  application:
    name: carteira-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carteira}
    username: ${DB_USER:carteira}
    password: ${DB_PASSWORD:carteira}
  jpa:
    # Evita consultas ao banco durante a renderização da resposta HTTP
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate apenas valida se as entidades batem com ele
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

seguranca:
  jwt:
    # Obrigatório, mínimo de 32 caracteres (HS256). Nunca versione o valor real.
    segredo: ${JWT_SECRET:}
    emissor: carteira-api
    expiracao: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

info:
  app:
    version: '@project.version@'

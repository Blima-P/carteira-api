# Perfil usado apenas pelo modo local (./mvnw spring-boot:test-run). Não vai para o JAR de produção.
seguranca:
  jwt:
    segredo: segredo-apenas-para-desenvolvimento-local-nunca-use-em-producao

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always
